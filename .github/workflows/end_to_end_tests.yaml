name: End-to-end tests

on:
  workflow_call:
  schedule:
    # At 07:00 on Monday
    - cron: '0 7 * * 1'

permissions: {}

jobs:
  end_to_end_tests:
    name: 'E2E tests - Node ${{ matrix.node-version }} - ${{ matrix.browser }} ${{ matrix.shard-index }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OAUTH_CLIENT_NAME: dexidp
      OAUTH_CLIENT_ID: client_test_web_id
      OAUTH_CLIENT_SECRET: client_test_web_secret
      OAUTH_REDIRECT_URL: 'http://localhost:5173/auth/login/oauth2/'
      OAUTH_OIDC_CONFIG_ENDPOINT: 'http://127.0.0.1:5556/dex/.well-known/openid-configuration'
      PUBLIC_OAUTH_CLIENT_NAME: dexidp
      PUBLIC_FRACTAL_DATA_URL: http://localhost:3000/data
      PUBLIC_FRACTAL_VIZARR_VIEWER_URL: http://localhost:3000/data/vizarr
      PUBLIC_FRACTAL_VOLE_VIEWER_URL: http://localhost/vole-viewer
      PUBLIC_FRACTAL_FEATURE_EXPLORER_URL: http://localhost:8501
      FRACTAL_RUNNER_BACKEND: local
      FRACTAL_DEFAULT_GROUP_NAME: All
      FRACTAL_ENABLE_TASK_GROUP_RESET: true
      PUBLIC_GUEST_USERNAME: guest@fractal.xy
      PUBLIC_GUEST_PASSWORD: guest

    strategy:
      matrix:
        node-version: ['24', '26']
        browser: ['chromium', 'firefox']
        shard-index: [1, 2, 3]
        shard-total: [3]
      fail-fast: false

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fractal_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      oauth2:
        image: ghcr.io/fractal-analytics-platform/oauth@sha256:42c80e3193d8eb5a20b5c88a90c625b9ea45ef9f5228b6676ea0b0494bed3d9a # 0.1
        ports:
          - 5556:5556

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 'latest-known'
          enable-cache: false
          python-version: '3.12'
      - run: uv sync --frozen
      - run: ./build-docs.sh

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        timeout-minutes: 3
        run: npx playwright install --with-deps --only-shell ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard-index }}/${{ matrix.shard-total }}

      - name: Archive test results
        if: ${{ !cancelled() && hashFiles('test-results/**/*.png') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-folder-node-${{ matrix.node-version }}-${{ matrix.browser }}-${{ matrix.shard-index }}
          path: test-results
          retention-days: 7

      - name: Upload blob report to GitHub Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.node-version }}-${{ matrix.browser }}-${{ matrix.shard-index }}
          path: blob-report
          retention-days: 1

  merge-reports:
    name: 'E2E tests - Merge Reports - Node ${{ matrix.node-version }}'
    # Merge reports after end_to_end_tests, even if some shards have failed
    if: ${{ !cancelled() }}
    needs: [end_to_end_tests]

    strategy:
      matrix:
        node-version: ['24', '26']

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports from GitHub Actions Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: all-blob-reports
          pattern: blob-report-${{ matrix.node-version }}-*
          merge-multiple: true

      - name: Merge into HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-html-report-${{ matrix.node-version }}-attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 7
