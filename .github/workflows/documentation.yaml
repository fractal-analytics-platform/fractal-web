name: docs

on: workflow_call

jobs:
  build:
    name: 'Build documentation'
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      ENABLE_FRACTAL_LINKS: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download playwright report artifact Node 24
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-html-report-24-attempt-${{ github.run_attempt }}
          path: docs/playwright-report-24

      - name: Download playwright report artifact Node 26
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playwright-html-report-26-attempt-${{ github.run_attempt }}
          path: docs/playwright-report-26

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 'latest-known'
          enable-cache: false
          python-version: '3.13'
      - run: uv sync --frozen
      - run: ./build-docs.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install components dependencies
        run: |
          cd components
          npm ci
      - name: Install sandbox dependencies
        run: |
          cd sandbox
          npm ci
      - name: Build sandbox
        run: |
          cd sandbox
          npm run build
      - name: Move sandbox built files in docs site
        run: mv sandbox/build/ site/sandbox
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'site'

  deploy:
    name: 'Deploy docs'
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      # https://github.com/actions/deploy-pages?tab=readme-ov-file
      # https://docs.github.com/en/actions/how-tos/secure-your-work/security-harden-deployments/oidc-in-cloud-providers#adding-permissions-settings
      pages: write # To create pages deployments when calling the GitHub API
      id-token: write # To request the OIDC JWT token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
